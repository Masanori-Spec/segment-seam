name: Verify Segment Seam
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q segment_seam tests scripts
      - run: npm test && npm run check:syntax
      - name: Record synthetic benchmark
        run: python scripts/benchmark.py --out benchmark-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-evidence-py${{ matrix.python }}
          path: benchmark-ci.json
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      UI_ARTIFACT_DIR: browser-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Mock races and responsive checks (sandbox enabled)
        run: npm run test:browser
      - name: Real local GPX worker and evidence ZIP (sandbox enabled)
        run: npm run test:browser:real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-artifacts/
          if-no-files-found: ignore
